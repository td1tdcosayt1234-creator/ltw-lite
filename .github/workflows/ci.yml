name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run translator tests
        run: make
      - name: Verify no Create-style crash patterns remain
        run: |
          ./test_glsl > /tmp/out.txt 2>&1
          grep -q "0 failure(s)" /tmp/out.txt || (cat /tmp/out.txt; exit 1)
